<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Server Protocol Bridge">
  <title>Server Protocol Bridge</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa8ff"/>
      <stop offset="1" stop-color="#0a5cc4"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#tile)"/>
  <!-- request: client to server -->
  <path d="M54 86h116" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
  <path d="M164 68l40 18-40 18z" fill="#ffffff"/>
  <!-- response: server to client -->
  <path d="M202 170H86" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
  <path d="M92 152l-40 18 40 18z" fill="#ffffff"/>
</svg>
