# SuperDebug configuration
# All reports are only produced on demand. Nothing is printed automatically.

# How often Player#getPing() is sampled for min/avg/max/jitter history.
sample-interval-seconds: 5

# Number of ping samples kept per player.
ping-history-size: 60

# Default number of packets captured by: debug sniff <player> on
sniff-default-max-packets: 50

# Maximum number of bytes captured from one Minecraft frame for packet sniffing.
# 2097152 matches the vanilla frame limit.
sniff-max-frame-bytes: 2097152

# Also write packet traces to plugins/SuperDebug/sniff/.
sniff-log-to-file: false

# A same-direction client-to-server frame arriving less than this many ms after
# the previous one is flagged as a GrimAC Post risk pair.  GrimAC's PostCheck
# treats a packet arriving less than 10ms after the previous movement packet as
# a Post violation; a web client stalling and then flushing a burst of packets
# is the classic trigger.
post-risk-gap-ms: 10

# Number of recent inbound packets kept per player for 'debug packets'.
packet-history-size: 40
