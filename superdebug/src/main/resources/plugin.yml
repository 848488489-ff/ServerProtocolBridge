name: SuperDebug
version: 1.2.0
main: dev.superdebug.SuperDebugPlugin
api-version: '26.3'
description: Console diagnostics for TCP/WSS Minecraft proxy debugging
authors: [Operator]
website: local
commands:
  debug:
    description: Latency, channel, packet and traffic diagnostics
    usage: /debug help
    aliases: [bd, superdebug]
    permission: superdebug.use
    permission-message: You do not have permission to use SuperDebug.
permissions:
  superdebug.use:
    description: Use all SuperDebug commands
    default: op
